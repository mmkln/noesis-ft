<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Noesis — logical knowledge graph." />
    <title>Noesis</title>
  </head>
  <body>
    <header class="topbar">
      <strong class="brand">Noesis</strong>

      <div class="account">
        <span id="account-email"></span>
        <button id="sign-out" type="button" hidden>Sign out</button>
      </div>
    </header>

    <main>
      <section id="login-view" class="centered" hidden>
        <div class="entry-card">
          <span class="entry-mark" aria-hidden="true"></span>
          <h1>Your knowledge graph</h1>
          <p>Sign in to open Noesis.</p>
          <button id="sign-in" class="primary-action" type="button">Sign in</button>
        </div>
      </section>

      <section id="loading-view" class="centered">
        <p>Loading Noesis…</p>
      </section>

      <section id="graph-view" hidden>
        <div
          id="spatial-world"
          class="spatial-world"
          tabindex="0"
          aria-label="Knowledge graph"
        ></div>

        <div class="spatial-toolbar" aria-label="Graph controls">
          <button id="fit-graph" type="button">Fit all</button>
          <button id="reset-camera" type="button">Reset view</button>
        </div>

        <p id="empty-state" class="empty-state" hidden>
          Your knowledge graph is empty.
        </p>
      </section>

      <p id="status" class="status" role="status" aria-live="polite"></p>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
